<style>
/* Charte graphique DeepIN Armour : violet #5A1E56, jaune soleil #FFC83D, rose poudré #F7D4DC,
   vert sauge #A8C9B5, crème #FFF7E8, bleu nuit #1E4D56. Titres Montserrat, textes Lato.
   À coller dans systeme.io : page > Paramètres > « Modifier le code d'en-tête ». */
body { background: #FFF7E8 !important; font-family: 'Lato', system-ui, sans-serif !important; }
[id^="text-"], [id^="text-"] *, [id^="survey-"], [id^="survey-"] * { font-family: 'Lato', system-ui, sans-serif !important; }
[id^="text-"] { color: #3D1A3A; }
[id^="headline-"], [id^="headline-"] * { font-family: 'Montserrat', system-ui, sans-serif !important; color: #5A1E56 !important; }
[id^="menu-"] a { color: #5A1E56 !important; font-family: 'Montserrat', system-ui, sans-serif !important; font-weight: 600 !important; }

/* Boutons : violet plein, texte crème (sur la page publiée, l'id est sur le bouton lui-même) */
[id^="button-"] { background: #5A1E56 !important; color: #FFF7E8 !important; border-radius: 14px !important; font-family: 'Montserrat', system-ui, sans-serif !important; font-weight: 700 !important; border: 0 !important; box-shadow: 0 8px 20px -8px rgba(90, 30, 86, .55) !important; }
[id^="button-"]:hover { background: #7a2d75 !important; }
[id^="button-"] * { color: inherit !important; font-family: inherit !important; }
/* Bouton secondaire de l'accroche : contour violet */
#button-ab12d90a { background: transparent !important; color: #5A1E56 !important; border: 2px solid #5A1E56 !important; box-shadow: none !important; }

/* Quiz */
[id^="survey-"] button { background: #5A1E56 !important; color: #FFF7E8 !important; border-radius: 14px !important; }
[id^="survey-"] input[type="radio"] { accent-color: #5A1E56; }

/* Bandeau d'appel à l'action : violet, sans la photo du modèle */

#section-34d9c6b7 [id^="headline-"], #section-34d9c6b7 [id^="headline-"] *, #section-34d9c6b7 [id^="text-"], #section-34d9c6b7 [id^="text-"] * { color: #FFF7E8 !important; }
